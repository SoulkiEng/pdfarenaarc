<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background App Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Document Sheet -->
  <g filter="url(#dropShadow)">
    <path d="M152 112 H296 L360 176 V392 C360 405.255 349.255 416 336 416 H152 C138.745 416 128 405.255 128 392 V136 C128 122.745 138.745 112 152 112 Z" fill="#FFFFFF"/>
    <!-- Folded Corner -->
    <path d="M296 112 V176 H360 Z" fill="url(#foldGrad)"/>
    
    <!-- Accent Line Bands -->
    <rect x="168" y="220" width="150" height="18" rx="9" fill="#F43F5E" opacity="0.85"/>
    <rect x="168" y="258" width="176" height="18" rx="9" fill="#E2E8F0"/>
    <rect x="168" y="296" width="130" height="18" rx="9" fill="#E2E8F0"/>
  </g>

  <!-- High-Tech WebAssembly ARC Badge -->
  <rect x="160" y="336" width="192" height="42" rx="12" fill="#E11D48"/>
  <text x="256" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PDFArenaArc</text>
</svg>
